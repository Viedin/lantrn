name: Tests

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the pull request replaces the run still going for the old one.
concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    # The SDK the Dockerfile builds with, so tests run on the same .NET as the image.
    container: mcr.microsoft.com/dotnet/sdk:11.0
    steps:
      - uses: actions/checkout@v4
      - run: dotnet test Lantrn.slnx
