services:
  lantrn:
    image: ghcr.io/viedin/lantrn:latest
    # `docker compose up --build` builds from source instead of pulling the published image.
    build: .
    ports:
      - "8080:8080"
    environment:
      Qdrant__Host: qdrant
      Qdrant__Port: 6334
      # Endpoints can also be set later on the Settings page.
      # Embeddings__BaseUrl: http://host.docker.internal:1234/v1
      # Embeddings__Model: text-embedding-qwen3-embedding-4b
      # Single sign-on, see https://viedin.github.io/lantrn/guide/sso
      # Oidc__Authority: https://auth.example.com/application/o/lantrn/
      # Oidc__ClientId: lantrn
      # Oidc__ClientSecret: change-me
      # Oidc__DisplayName: Sign in with Authentik
      # Oidc__AutoProvision: "false"
      # Oidc__TrustEmail: "false"
      # Oidc__AdminGroup: lantrn-admins
      # Oidc__DisableLocalLogin: "false"
      # ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"
    volumes:
      - lantrn-data:/app/data
    depends_on:
      - qdrant
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant-data:/qdrant/storage
    restart: unless-stopped

volumes:
  lantrn-data:
  qdrant-data:
